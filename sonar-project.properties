sonar.projectKey=instana_pipeline-feedback-orb
sonar.organization=instana
sonar.projectName=pipeline-feedback-orb

sonar.host.url=https://sonarcloud.io

sonar.lang.patterns.shell=**/src/scripts/*
sonar.sh.file.suffixes=.sh

sonar.sources=.
sonar.exclusions=LICENSE,NOTICE,.gitignore,**/*.md
sonar.inclusions=**/*.yaml,**/*.yml,**/*.sh,**/Dockerfile*

sonar.docker.activate=true
sonar.lang.patterns.docker=**/default-executor/Dockerfile


sonar.scm.provider=git
sonar.yaml.activate=true

sonar.yaml.file.suffixes=.yaml,.yml
sonar.text.inclusions.activate=true
sonar.text.inclusions=**/*.yaml,**/*.yml,**/*.sh